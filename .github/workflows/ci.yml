name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: moneysuivi_test
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/moneysuivi_test
      DIRECT_URL: postgresql://test:test@localhost:5432/moneysuivi_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/moneysuivi_test
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - run: npm ci
    - run: npx prisma validate
    - name: Apply migrations to an empty database
      run: npx prisma migrate deploy
    - name: Migrations must produce exactly schema.prisma
      run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
    - run: npm run test:unit
    - run: npm run test:integration
    - name: Dependency audit (fails on critical runtime vulnerabilities)
      run: npm audit --omit=dev --audit-level=critical

  frontend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
    - run: npm run build
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - name: Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
    - name: Dependency audit (fails on critical vulnerabilities)
      run: npm audit --audit-level=critical
